name: resp-mcp checks

on:
  pull_request:
    paths: ["resp-mcp/**", ".github/workflows/resp-mcp-ci.yml"]
  push:
    paths: ["resp-mcp/**", ".github/workflows/resp-mcp-ci.yml"]

defaults:
  run:
    working-directory: resp-mcp

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check scripts src tests
      - run: uv run ruff format --check scripts src tests
      - run: uv run mypy
      - run: uv run pytest tests/unit

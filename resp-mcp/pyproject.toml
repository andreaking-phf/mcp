[project]
name = "respmcp"
version = "0.0.1"
description = "Respiratory virus surveillance data, harmonized in DuckDB and served over MCP."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins for the pilot (decision 0008). Upgrade deliberately, one package at a time.
dependencies = [
    "duckdb==2.0.0",
    "mcp[cli]==2.3.0",
    "httpx==0.28.1",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "python-dotenv==1.2.4",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "epiweeks==2.4.0",
    "us==4.0.0",
]

[project.scripts]
respmcp = "respmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respmcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live APIs; runs only when RESPMCP_LIVE=1"]
